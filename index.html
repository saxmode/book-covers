.gallery{display:none;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.4rem}

.cover{cursor:pointer;border:1px solid #30363d;border-radius:4px;overflow:hidden;background:#fff;transition:transform .15s,border-color .15s}
.cover:hover{transform:translateY(-4px);border-color:#8ff0a4}
.frame{position:relative;aspect-ratio:3/4;background:#fff;container-type:inline-size;overflow:hidden}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;padding:5cqw;mix-blend-mode:var(--t-blend,difference);color:#fff;pointer-events:none}

.ov-title{font-size:calc(var(--book-size,20) * 1cqw * var(--t-scale,1));text-align:var(--t-align,left);color:var(--t-color,#fff);font-weight:900;line-height:var(--t-lh,.92);text-transform:uppercase;letter-spacing:-.01em;word-break:break-word;hyphens:auto}

/* typography control bar */
.typo-bar{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:.7rem 1rem;margin-bottom:1.2rem;font-family:"Courier New",monospace;font-size:.78rem}
.typo-bar .grp{display:flex;gap:.3rem;align-items:center}
.typo-bar label{color:#8b949e;letter-spacing:.04em;margin-right:.2rem}

.typo-bar input[type=range]{accent-color:#8ff0a4;width:120px}
.typo-bar .sw{width:18px;height:18px;padding:0;border-radius:3px;border:1px solid #30363d;cursor:pointer}

.typo-bar .sw-auto{width:auto;height:auto;padding:.25rem .5rem;background:transparent;color:#8b949e;font-size:.7rem}

.modal.active{display:flex}

const IMG_BASE="https://rysvmrwyqxfoefnpcuwu.supabase.co/storage/v1/object/public/book-covers";
function slug(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function frameHTML(style,rank,b){
  const rs=String(rank).padStart(3,"0");
  const src=`${IMG_BASE}/${style}/${rs}_${slug(b.title)}.png`;     // image keyed by EN slug
  const de=(tcfg.lang==="de");
  const ttl=de?(b.title_de||b.title):b.title;
  const sz=de?b.size_de:b.size;
  const foot=b.year?`${b.author} &middot; ${b.year}`:b.author;
  return `<div class="frame"><img src="${src}" alt="${ttl}" onerror="this.style.opacity=.12">
    <div class="overlay" style="font-family:'${b.font}',serif">
      <div class="ov-main"><div class="ov-title" style="--book-size:${sz}">${ttl}</div></div>
      <div class="ov-foot">${foot}</div></div></div>`;
}
function render(style){
  const c=document.getElementById(style); if(!c||c.dataset.done||style==="showcase")return; c.innerHTML="";
  for(const [rank,b] of Object.entries(books)){
    const d=document.createElement("div"); d.className="cover";
    d.innerHTML=frameHTML(style,rank,b)+`<div class="cap"><b>#${String(rank).padStart(3,"0")}</b> ${b.title}</div>`;
    d.onclick=()=>{document.getElementById("modal-host").innerHTML=frameHTML(style,rank,b).replace('class="frame"','class="modal-frame"');
      document.getElementById("modal").classList.add("active");};
    c.appendChild(d);
  }
  c.dataset.done="1";
}
document.querySelectorAll(".tab-button").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll(".tab-button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".gallery").forEach(g=>g.classList.remove("active"));
  btn.classList.add("active");
  const s=btn.dataset.style; document.getElementById(s).classList.add("active"); render(s);
});
document.querySelector(".modal-close").onclick=()=>document.getElementById("modal").classList.remove("active");
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")document.getElementById("modal").classList.remove("active")};
// typography controls -> CSS vars on :root, persisted
const TKEY="typo-cfg";
const tcfg=Object.assign({lang:"en",scale:1,lh:0.92,justify:"center",align:"left",blend:"difference",color:""},JSON.parse(localStorage.getItem(TKEY)||"{}"));
const DARK_BLENDS=["multiply","darken","color-burn"];   // white text vanishes on these -> use black
function applyTypo(){
  const r=document.documentElement.style;
  r.setProperty("--t-scale",tcfg.scale); r.setProperty("--t-lh",tcfg.lh);
  r.setProperty("--t-justify",tcfg.justify); r.setProperty("--t-align",tcfg.align); r.setProperty("--t-blend",tcfg.blend);
  const auto=DARK_BLENDS.includes(tcfg.blend)?"#000":"#fff";
  r.setProperty("--t-color", tcfg.color || auto);          // explicit swatch overrides blend-auto
  document.querySelectorAll(".typo-bar button[data-k]").forEach(b=>b.classList.toggle("on",tcfg[b.dataset.k]===b.dataset.v));
  document.querySelectorAll(".typo-bar .sw").forEach(b=>b.classList.toggle("on",(b.dataset.color||"")===tcfg.color));
  document.getElementById("t-size").value=tcfg.scale; document.getElementById("t-lh").value=tcfg.lh;
  document.getElementById("t-blend").value=tcfg.blend;
  localStorage.setItem(TKEY,JSON.stringify(tcfg));
}
document.querySelectorAll(".typo-bar button[data-k]").forEach(b=>b.onclick=()=>{
  tcfg[b.dataset.k]=b.dataset.v; applyTypo();
  if(b.dataset.k==="lang"){                       // titles change -> re-render visible tab
    document.querySelectorAll(".gallery").forEach(g=>g.removeAttribute("data-done"));
    const a=document.querySelector(".gallery.active"); if(a) render(a.id);
  }});
document.querySelectorAll(".typo-bar .sw").forEach(b=>b.onclick=()=>{tcfg.color=b.dataset.color||"";applyTypo();});
document.getElementById("t-size").oninput=e=>{tcfg.scale=parseFloat(e.target.value);applyTypo();};
document.getElementById("t-lh").oninput=e=>{tcfg.lh=parseFloat(e.target.value);applyTypo();};
document.getElementById("t-blend").onchange=e=>{tcfg.blend=e.target.value;applyTypo();};
// presets — save/load/delete the full type config, persisted
const PKEY="typo-presets";
let presets=JSON.parse(localStorage.getItem(PKEY)||"{}");
function refreshPresets(sel){const s=document.getElementById("t-presets");
  s.innerHTML='<option value="">—</option>'+Object.keys(presets).sort().map(n=>`<option ${n===sel?"selected":""}>${n}</option>`).join("");}
document.getElementById("t-save").onclick=()=>{const i=document.getElementById("t-pname");const n=i.value.trim();
  if(!n)return; presets[n]={...tcfg}; localStorage.setItem(PKEY,JSON.stringify(presets)); refreshPresets(n); i.value="";};
document.getElementById("t-presets").onchange=e=>{const n=e.target.value; if(presets[n]){Object.assign(tcfg,presets[n]);applyTypo();refreshPresets(n);}};
document.getElementById("t-del").onclick=()=>{const n=document.getElementById("t-presets").value;
  if(n&&presets[n]){delete presets[n];localStorage.setItem(PKEY,JSON.stringify(presets));refreshPresets();}};
refreshPresets();
applyTypo();
render("single_line");
</script></body></html>
